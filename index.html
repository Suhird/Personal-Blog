<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Suhird Singh's blog — deep dives into gRPC, GraphQL, Python, Go, Rust, microservices, cloud architecture, and life beyond code." />

    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0b0b13" />

    <!-- Apply the saved reading mode before first paint (no flash of the wrong skin) -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("site-mode");
          var mode = stored === "reader" || stored === "terminal" ? stored : "terminal";
          // Optional shareable override: ?skin=reader or ?skin=terminal
          var requested = new URLSearchParams(window.location.search).get("skin");
          if (requested === "reader" || requested === "terminal") mode = requested;
          document.documentElement.dataset.mode = mode;
          document.documentElement.style.colorScheme = mode === "reader" ? "light" : "dark";
          var themeColor = document.querySelector('meta[name="theme-color"]');
          if (themeColor) {
            themeColor.setAttribute("content", mode === "reader" ? "#f8f2e6" : "#0b0b13");
          }
        } catch (error) {
          document.documentElement.dataset.mode = "terminal";
        }
      })();
    </script>
