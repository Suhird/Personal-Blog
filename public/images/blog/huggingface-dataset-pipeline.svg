<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Hugging Face dataset processing attack surface</title>
  <desc id="desc">An uploaded dataset flows through config parsing, a remote-code loader, a Jinja template, and format parsers. Each of these is a potential code execution path inside a worker pod.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f38ba8"/>
    </marker>
    <style>
      .bg { fill:#1e1e2e; }
      .box { fill:#181825; stroke:#45475a; stroke-width:1.5; }
      .box-red { fill:#2a151b; stroke:#f38ba8; stroke-width:1.8; }
      .box-yellow { fill:#2a2618; stroke:#f9e2af; stroke-width:1.8; }
      .box-cyan { fill:#11242b; stroke:#89dceb; stroke-width:1.8; }
      .box-green { fill:#17251a; stroke:#a6e3a1; stroke-width:1.8; }
      .title { fill:#cdd6f4; font:700 22px "JetBrains Mono","Hack",monospace; }
      .sub { fill:#a6adc8; font:14px "JetBrains Mono","Hack",monospace; }
      .label { fill:#cdd6f4; font:700 14px "JetBrains Mono","Hack",monospace; }
      .small { fill:#a6adc8; font:12px "JetBrains Mono","Hack",monospace; }
      .mono { fill:#f9e2af; font:11px "JetBrains Mono","Hack",monospace; }
      .line { stroke:#f38ba8; stroke-width:2; fill:none; }
      .dash { stroke:#6c7086; stroke-width:1.5; fill:none; stroke-dasharray:6 5; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="620" rx="18"/>
  <text class="title" x="48" y="50">DATASET PROCESSING IS AN INTERPRETER</text>
  <text class="sub" x="48" y="76">Every stage below executes something the uploader controls. The worker pod is the real security boundary.</text>

  <rect class="box-yellow" x="52" y="120" width="190" height="130" rx="12"/>
  <text class="label" x="72" y="152" fill="#f9e2af">Dataset upload</text>
  <text class="small" x="72" y="180">config.json</text>
  <text class="small" x="72" y="202">loader script</text>
  <text class="small" x="72" y="224">HDF5 / parquet</text>
  <text class="mono" x="72" y="248">untrusted input</text>

  <rect class="box-red" x="292" y="120" width="210" height="130" rx="12"/>
  <text class="label" x="312" y="152" fill="#f38ba8">Config parse</text>
  <text class="small" x="312" y="180">Jinja2 templating</text>
  <text class="small" x="312" y="202">expression evaluation</text>
  <text class="small" x="312" y="224">defaults + includes</text>
  <text class="mono" x="312" y="248">template injection</text>

  <rect class="box-red" x="552" y="120" width="210" height="130" rx="12"/>
  <text class="label" x="572" y="152" fill="#f38ba8">Remote loader</text>
  <text class="small" x="572" y="180">trust_remote_code</text>
  <text class="small" x="572" y="202">imports arbitrary module</text>
  <text class="small" x="572" y="224">runs at load time</text>
  <text class="mono" x="572" y="248">RCE path #1</text>

  <rect class="box-red" x="812" y="120" width="320" height="130" rx="12"/>
  <text class="label" x="832" y="152" fill="#f38ba8">Format parser</text>
  <text class="small" x="832" y="180">HDF5 external raw storage</text>
  <text class="small" x="832" y="202">returns local file contents</text>
  <text class="small" x="832" y="224">arbitrary file read</text>
  <text class="mono" x="832" y="248">RCE path #2 + secret theft</text>

  <!-- worker pod -->
  <rect x="52" y="320" width="650" height="220" rx="14" fill="none" stroke="#89dceb" stroke-dasharray="8 6"/>
  <text class="small" x="76" y="348" fill="#89dceb">PROCESSING WORKER POD</text>
  <rect class="box-cyan" x="78" y="370" width="270" height="140" rx="10"/>
  <text class="label" x="98" y="402" fill="#89dceb">What the attacker gets</text>
  <text class="small" x="98" y="430">environment variables</text>
  <text class="small" x="98" y="452">cloud + cluster tokens</text>
  <text class="small" x="98" y="474">service account credentials</text>
  <text class="mono" x="98" y="498">the worker's own source</text>

  <rect class="box-red" x="380" y="370" width="296" height="140" rx="10"/>
  <text class="label" x="400" y="402" fill="#f38ba8">What happens next</text>
  <text class="small" x="400" y="430">node-level access</text>
  <text class="small" x="400" y="452">lateral movement to clusters</text>
  <text class="small" x="400" y="474">internal datasets + CI</text>
  <text class="mono" x="400" y="498">cluster admin in ~13h</text>

  <path class="line" d="M 242 185 L 292 185" marker-end="url(#arrow)"/>
  <path class="line" d="M 502 185 L 552 185" marker-end="url(#arrow)"/>
  <path class="line" d="M 762 185 L 812 185" marker-end="url(#arrow)"/>
  <path class="line" d="M 972 250 C 972 300, 300 280, 213 370" marker-end="url(#arrow)"/>

  <!-- defenses -->
  <rect x="742" y="320" width="390" height="220" rx="14" class="box"/>
  <text class="label" x="764" y="352" fill="#a6e3a1">DEFENSES THAT ACTUALLY BOUND THE BLAST RADIUS</text>
  <text class="small" x="764" y="382">Run dataset processing in a sandbox with no ambient cloud identity.</text>
  <text class="small" x="764" y="404">Deny egress by default; allowlist object storage and package registries.</text>
  <text class="small" x="764" y="426">Use per-job short-lived credentials, never node-level roles.</text>
  <text class="small" x="764" y="448">Disable remote code loaders unless the publisher is explicitly trusted.</text>
  <text class="small" x="764" y="470">Render templates in a logic-less mode; never eval config.</text>
  <text class="small" x="764" y="492">Patch parsers; fuzz HDF5, parquet, pickle, and archive handlers.</text>
  <text class="small" x="764" y="514">Alert on worker -> metadata API calls and unusual cluster API verbs.</text>

  <text class="small" x="52" y="586">The Hugging Face incident was not a single bug. It was a chain of small assumptions, each individually reasonable, that composed into cluster admin.</text>
</svg>
