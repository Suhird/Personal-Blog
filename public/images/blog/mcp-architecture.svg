<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Model Context Protocol architecture</title>
  <desc id="desc">An MCP host contains a client connected to one or more MCP servers. Servers expose tools, resources, and prompts over JSON-RPC transports such as stdio or HTTP.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#89dceb"/>
    </marker>
    <style>
      .bg { fill:#1e1e2e; }
      .box { fill:#181825; stroke:#45475a; stroke-width:1.5; }
      .box-cyan { fill:#11242b; stroke:#89dceb; stroke-width:1.8; }
      .box-green { fill:#17251a; stroke:#a6e3a1; stroke-width:1.8; }
      .box-mauve { fill:#241b2f; stroke:#cba6f7; stroke-width:1.8; }
      .box-yellow { fill:#2a2618; stroke:#f9e2af; stroke-width:1.8; }
      .title { fill:#cdd6f4; font:700 22px "JetBrains Mono","Hack",monospace; }
      .sub { fill:#a6adc8; font:14px "JetBrains Mono","Hack",monospace; }
      .label { fill:#cdd6f4; font:700 15px "JetBrains Mono","Hack",monospace; }
      .small { fill:#a6adc8; font:12px "JetBrains Mono","Hack",monospace; }
      .mono { fill:#f9e2af; font:12px "JetBrains Mono","Hack",monospace; }
      .line { stroke:#89dceb; stroke-width:2; fill:none; }
      .dash { stroke:#6c7086; stroke-width:1.5; fill:none; stroke-dasharray:6 5; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="620" rx="18"/>
  <text class="title" x="48" y="52">MCP: ONE PROTOCOL, MANY CAPABILITY PROVIDERS</text>
  <text class="sub" x="48" y="78">The host owns the model and the user consent. The server owns the capability. JSON-RPC connects them.</text>

  <!-- host -->
  <rect x="52" y="120" width="540" height="340" rx="16" fill="none" stroke="#cba6f7" stroke-dasharray="8 6"/>
  <text class="small" x="76" y="148" fill="#cba6f7">MCP HOST (desktop app, IDE, agent runtime)</text>

  <rect class="box-mauve" x="78" y="178" width="220" height="110" rx="10"/>
  <text class="label" x="98" y="210" fill="#cba6f7">LLM / agent loop</text>
  <text class="small" x="98" y="238">decides which tool</text>
  <text class="small" x="98" y="260">to call and when</text>

  <rect class="box-mauve" x="330" y="178" width="230" height="110" rx="10"/>
  <text class="label" x="350" y="210" fill="#cba6f7">MCP client</text>
  <text class="small" x="350" y="238">one connection per server</text>
  <text class="small" x="350" y="260">capability discovery</text>

  <rect class="box" x="78" y="330" width="482" height="100" rx="10"/>
  <text class="label" x="98" y="360">Consent + policy</text>
  <text class="small" x="98" y="386">user approves tool calls; allowlist, scopes, audit log</text>
  <text class="small" x="98" y="408">the host is the security boundary, not the server</text>

  <path class="line" d="M 298 233 L 330 233" marker-end="url(#arrow)"/>

  <!-- transports -->
  <rect class="box-yellow" x="630" y="210" width="180" height="150" rx="12"/>
  <text class="label" x="650" y="242" fill="#f9e2af">Transport</text>
  <text class="small" x="650" y="270">stdio (local)</text>
  <text class="small" x="650" y="292">Streamable HTTP</text>
  <text class="small" x="650" y="314">JSON-RPC 2.0</text>
  <text class="mono" x="650" y="340">request / response</text>

  <!-- servers -->
  <rect class="box-green" x="850" y="130" width="300" height="120" rx="12"/>
  <text class="label" x="872" y="162" fill="#a6e3a1">Filesystem server</text>
  <text class="small" x="872" y="190">tools: read_file, search</text>
  <text class="small" x="872" y="212">resources: file:// URIs</text>
  <text class="mono" x="872" y="234">scoped to a workspace root</text>

  <rect class="box-green" x="850" y="280" width="300" height="120" rx="12"/>
  <text class="label" x="872" y="312" fill="#a6e3a1">Postgres server</text>
  <text class="small" x="872" y="340">tools: query, describe</text>
  <text class="small" x="872" y="362">resources: schema</text>
  <text class="mono" x="872" y="384">read-only role recommended</text>

  <rect class="box-green" x="850" y="430" width="300" height="120" rx="12"/>
  <text class="label" x="872" y="462" fill="#a6e3a1">Your internal server</text>
  <text class="small" x="872" y="490">tools: deploy, create_ticket</text>
  <text class="small" x="872" y="512">prompts: runbooks</text>
  <text class="mono" x="872" y="534">auth + audit required</text>

  <path class="line" d="M 560 233 L 630 250" marker-end="url(#arrow)"/>
  <path class="line" d="M 810 250 L 850 200" marker-end="url(#arrow)"/>
  <path class="line" d="M 810 285 L 850 330" marker-end="url(#arrow)"/>
  <path class="line" d="M 810 330 L 850 470" marker-end="url(#arrow)"/>

  <!-- primitives -->
  <rect class="box-cyan" x="52" y="500" width="760" height="76" rx="10"/>
  <text class="label" x="74" y="528" fill="#89dceb">Three primitives</text>
  <text class="small" x="74" y="552">Tools = actions with side effects. Resources = read-only context. Prompts = reusable templates.</text>
  <text class="small" x="74" y="570">Discovery is dynamic: the client asks what exists, then the model chooses from that list.</text>
</svg>
