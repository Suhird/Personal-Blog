<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Local-first sync architecture with CRDTs</title>
  <desc id="desc">Devices write to a local database immediately. A sync engine exchanges operations, merges them with a CRDT, and reconciles state without a central lock.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#89dceb"/>
    </marker>
    <style>
      .bg { fill:#1e1e2e; }
      .box { fill:#181825; stroke:#45475a; stroke-width:1.5; }
      .box-cyan { fill:#11242b; stroke:#89dceb; stroke-width:1.8; }
      .box-green { fill:#17251a; stroke:#a6e3a1; stroke-width:1.8; }
      .box-mauve { fill:#241b2f; stroke:#cba6f7; stroke-width:1.8; }
      .box-yellow { fill:#2a2618; stroke:#f9e2af; stroke-width:1.8; }
      .title { fill:#cdd6f4; font:700 22px "JetBrains Mono","Hack",monospace; }
      .sub { fill:#a6adc8; font:14px "JetBrains Mono","Hack",monospace; }
      .label { fill:#cdd6f4; font:700 14px "JetBrains Mono","Hack",monospace; }
      .small { fill:#a6adc8; font:12px "JetBrains Mono","Hack",monospace; }
      .mono { fill:#f9e2af; font:11px "JetBrains Mono","Hack",monospace; }
      .line { stroke:#89dceb; stroke-width:2; fill:none; }
      .dash { stroke:#6c7086; stroke-width:1.5; fill:none; stroke-dasharray:6 5; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="650" rx="18"/>
  <text class="title" x="48" y="50">LOCAL-FIRST: THE NETWORK IS AN OPTIMIZATION, NOT A REQUIREMENT</text>
  <text class="sub" x="48" y="76">Write to disk first. Sync later. Merge deterministically. The spinner disappears because the source of truth is local.</text>

  <!-- device a -->
  <rect class="box-cyan" x="52" y="116" width="300" height="250" rx="14"/>
  <text class="label" x="76" y="148" fill="#89dceb">Device A (online -> offline)</text>
  <rect x="76" y="168" width="252" height="70" rx="8" fill="#1e1e2e" stroke="#45475a"/>
  <text class="small" x="92" y="194">local DB (SQLite / IndexedDB)</text>
  <text class="mono" x="92" y="218">instant read + write</text>
  <rect x="76" y="256" width="252" height="86" rx="8" fill="#1e1e2e" stroke="#45475a"/>
  <text class="small" x="92" y="282">outbox / operation log</text>
  <text class="small" x="92" y="304">pending changes survive restart</text>
  <text class="mono" x="92" y="328">sync when reachable</text>

  <!-- sync server -->
  <rect class="box-mauve" x="450" y="116" width="300" height="250" rx="14"/>
  <text class="label" x="474" y="148" fill="#cba6f7">Sync service</text>
  <rect x="474" y="168" width="252" height="70" rx="8" fill="#1e1e2e" stroke="#45475a"/>
  <text class="small" x="490" y="194">relay / durable log</text>
  <text class="mono" x="490" y="218">WebSocket or HTTP</text>
  <rect x="474" y="256" width="252" height="86" rx="8" fill="#1e1e2e" stroke="#45475a"/>
  <text class="small" x="490" y="282">auth + per-document ACL</text>
  <text class="small" x="490" y="304">presence, cursors, awareness</text>
  <text class="mono" x="490" y="328">not the source of truth</text>

  <!-- device b -->
  <rect class="box-green" x="848" y="116" width="300" height="250" rx="14"/>
  <text class="label" x="872" y="148" fill="#a6e3a1">Device B (offline for a week)</text>
  <rect x="872" y="168" width="252" height="70" rx="8" fill="#1e1e2e" stroke="#45475a"/>
  <text class="small" x="888" y="194">local DB</text>
  <text class="mono" x="888" y="218">still fully editable</text>
  <rect x="872" y="256" width="252" height="86" rx="8" fill="#1e1e2e" stroke="#45475a"/>
  <text class="small" x="888" y="282">same merge rules</text>
  <text class="small" x="888" y="304">no central lock, no lost edits</text>
  <text class="mono" x="888" y="328">reconnect and converge</text>

  <path class="line" d="M 352 240 L 450 240" marker-end="url(#arrow)"/>
  <path class="line" d="M 750 240 L 848 240" marker-end="url(#arrow)"/>

  <!-- merge -->
  <rect class="box-yellow" x="52" y="416" width="1096" height="130" rx="12"/>
  <text class="label" x="76" y="448" fill="#f9e2af">CRDT MERGE: DETERMINISTIC, COMMUTATIVE, IDEMPOTENT</text>
  <text class="small" x="76" y="476">Text: sequence CRDT (Yjs / Automerge) preserves concurrent inserts without a server arbiter.</text>
  <text class="small" x="76" y="500">Counters: grow-only + per-replica counts; sets: add/remove with tombstones or observed-remove semantics.</text>
  <text class="small" x="76" y="524">Conflict is not an error. It is a state the merge function must define, test, and explain to users.</text>

  <!-- bottom -->
  <rect x="52" y="570" width="1096" height="56" rx="10" class="box"/>
  <text class="small" x="76" y="596" fill="#89dceb">The hard parts are permissions, schema migration, large documents, and undo. The network protocol is the easy part.</text>
  <text class="small" x="76" y="616">Design for offline first; treat the server as a relay that can be replaced, not a god that owns the data.</text>
</svg>
