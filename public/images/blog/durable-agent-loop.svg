<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">Durable AI agent loop</title>
  <desc id="desc">An AI agent is split into a deterministic workflow and non-deterministic activities: planning, model calls, tool calls, human approval, and state checkpoints.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#89dceb"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f38ba8"/>
    </marker>
    <style>
      .bg { fill:#1e1e2e; }
      .box { fill:#181825; stroke:#45475a; stroke-width:1.5; }
      .box-cyan { fill:#11242b; stroke:#89dceb; stroke-width:1.8; }
      .box-mauve { fill:#241b2f; stroke:#cba6f7; stroke-width:1.8; }
      .box-green { fill:#17251a; stroke:#a6e3a1; stroke-width:1.8; }
      .box-red { fill:#2a151b; stroke:#f38ba8; stroke-width:1.8; }
      .title { fill:#cdd6f4; font:700 22px "JetBrains Mono","Hack",monospace; }
      .sub { fill:#a6adc8; font:14px "JetBrains Mono","Hack",monospace; }
      .label { fill:#cdd6f4; font:700 15px "JetBrains Mono","Hack",monospace; }
      .small { fill:#a6adc8; font:12px "JetBrains Mono","Hack",monospace; }
      .mono { fill:#f9e2af; font:12px "JetBrains Mono","Hack",monospace; }
      .line { stroke:#89dceb; stroke-width:2; fill:none; }
      .line-red { stroke:#f38ba8; stroke-width:2; fill:none; }
      .dash { stroke:#6c7086; stroke-width:1.5; fill:none; stroke-dasharray:6 5; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="660" rx="18"/>
  <text class="title" x="48" y="52">A DURABLE AGENT IS A WORKFLOW, NOT A WHILE LOOP</text>
  <text class="sub" x="48" y="78">The loop is deterministic. The model, tools, and humans are activities that can fail, retry, and pause.</text>

  <!-- workflow boundary -->
  <rect x="52" y="112" width="820" height="430" rx="16" fill="none" stroke="#89dceb" stroke-dasharray="8 6"/>
  <text class="small" x="76" y="140" fill="#89dceb">WORKFLOW (deterministic, replayable)</text>

  <!-- plan -->
  <rect class="box-cyan" x="90" y="180" width="210" height="110" rx="12"/>
  <text class="label" x="112" y="212" fill="#89dceb">1. Plan</text>
  <text class="small" x="112" y="240">read goal + memory</text>
  <text class="small" x="112" y="262">decide next action</text>

  <!-- model call -->
  <rect class="box-mauve" x="350" y="180" width="220" height="110" rx="12"/>
  <text class="label" x="372" y="212" fill="#cba6f7">2. Model call</text>
  <text class="small" x="372" y="240">activity: llm.complete</text>
  <text class="small" x="372" y="262">retry on 429 / timeout</text>

  <!-- tool call -->
  <rect class="box-green" x="620" y="180" width="220" height="110" rx="12"/>
  <text class="label" x="642" y="212" fill="#a6e3a1">3. Tool call</text>
  <text class="small" x="642" y="240">activity: search / sql</text>
  <text class="small" x="642" y="262">idempotency key required</text>

  <!-- checkpoint -->
  <rect class="box" x="350" y="360" width="490" height="120" rx="12"/>
  <text class="label" x="372" y="394" fill="#cdd6f4">4. Checkpoint + continue</text>
  <text class="small" x="372" y="422">event history stores every model response and tool result</text>
  <text class="small" x="372" y="446">crash at step 37? resume at step 37, not step 1</text>
  <text class="mono" x="372" y="468">continue_as_new() at 10k events / 50MB</text>

  <!-- human -->
  <rect class="box-red" x="90" y="360" width="210" height="120" rx="12"/>
  <text class="label" x="112" y="394" fill="#f38ba8">Human gate</text>
  <text class="small" x="112" y="422">signal: approved</text>
  <text class="small" x="112" y="446">can wait days</text>
  <text class="small" x="112" y="468">no compute held</text>

  <!-- arrows -->
  <path class="line" d="M 300 235 L 350 235" marker-end="url(#arrow)"/>
  <path class="line" d="M 570 235 L 620 235" marker-end="url(#arrow)"/>
  <path class="line" d="M 730 290 L 730 360" marker-end="url(#arrow)"/>
  <path class="line" d="M 350 420 L 300 420" marker-end="url(#arrow-red)"/>
  <path class="line-red" d="M 195 360 L 195 290" marker-end="url(#arrow-red)"/>
  <text class="small" x="210" y="330">pause</text>

  <!-- outside failure -->
  <rect class="box-red" x="920" y="180" width="220" height="110" rx="12"/>
  <text class="label" x="942" y="212" fill="#f38ba8">Crash / timeout</text>
  <text class="small" x="942" y="240">worker dies, provider 500s,</text>
  <text class="small" x="942" y="262">tool hangs for 30 minutes</text>
  <path class="dash" d="M 870 235 L 920 235" marker-end="url(#arrow-red)"/>
  <text class="small" x="922" y="320">history replays; retries are</text>
  <text class="small" x="922" y="340">bounded by policy, not hope</text>

  <!-- bottom principle -->
  <rect x="52" y="570" width="1096" height="58" rx="10" class="box"/>
  <text class="small" x="76" y="596" fill="#f9e2af">Rule of thumb: if an agent action costs money, touches production, or takes longer than a request, it belongs in a workflow.</text>
  <text class="small" x="76" y="616">Keep prompts and model choice versioned; keep side effects inside idempotent activities.</text>
</svg>
