<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">WebAssembly component model</title>
  <desc id="desc">A host runtime composes components through typed WIT interfaces. WASI provides portable system capabilities such as files, clocks, sockets, and random numbers.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#89dceb"/>
    </marker>
    <style>
      .bg { fill:#1e1e2e; }
      .box { fill:#181825; stroke:#45475a; stroke-width:1.5; }
      .box-cyan { fill:#11242b; stroke:#89dceb; stroke-width:1.8; }
      .box-green { fill:#17251a; stroke:#a6e3a1; stroke-width:1.8; }
      .box-mauve { fill:#241b2f; stroke:#cba6f7; stroke-width:1.8; }
      .box-yellow { fill:#2a2618; stroke:#f9e2af; stroke-width:1.8; }
      .title { fill:#cdd6f4; font:700 22px "JetBrains Mono","Hack",monospace; }
      .sub { fill:#a6adc8; font:14px "JetBrains Mono","Hack",monospace; }
      .label { fill:#cdd6f4; font:700 14px "JetBrains Mono","Hack",monospace; }
      .small { fill:#a6adc8; font:12px "JetBrains Mono","Hack",monospace; }
      .mono { fill:#f9e2af; font:11px "JetBrains Mono","Hack",monospace; }
      .line { stroke:#89dceb; stroke-width:2; fill:none; }
      .dash { stroke:#6c7086; stroke-width:1.5; fill:none; stroke-dasharray:6 5; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="650" rx="18"/>
  <text class="title" x="48" y="50">WASM COMPONENTS: INTERFACES, NOT JUST SANDBOXES</text>
  <text class="sub" x="48" y="76">The component model gives WebAssembly what containers got from HTTP: a typed contract between parts.</text>

  <!-- host -->
  <rect x="52" y="112" width="1096" height="300" rx="16" fill="none" stroke="#cba6f7" stroke-dasharray="8 6"/>
  <text class="small" x="76" y="140" fill="#cba6f7">HOST RUNTIME (wasmtime, wasmer, browser, edge platform)</text>

  <rect class="box-mauve" x="78" y="170" width="270" height="180" rx="12"/>
  <text class="label" x="98" y="202" fill="#cba6f7">Component A</text>
  <text class="small" x="98" y="230">business logic</text>
  <text class="small" x="98" y="252">exports: handle-request</text>
  <text class="small" x="98" y="274">imports: db, logger</text>
  <text class="mono" x="98" y="302">compiled once</text>
  <text class="mono" x="98" y="324">runs anywhere</text>

  <rect class="box-green" x="382" y="170" width="270" height="180" rx="12"/>
  <text class="label" x="402" y="202" fill="#a6e3a1">Component B</text>
  <text class="small" x="402" y="230">database adapter</text>
  <text class="small" x="402" y="252">exports: query, exec</text>
  <text class="small" x="402" y="274">imports: wasi:sockets</text>
  <text class="mono" x="402" y="302">swappable</text>
  <text class="mono" x="402" y="324">language-agnostic</text>

  <rect class="box-yellow" x="686" y="170" width="270" height="180" rx="12"/>
  <text class="label" x="706" y="202" fill="#f9e2af">Component C</text>
  <text class="small" x="706" y="230">auth / policy</text>
  <text class="small" x="706" y="252">exports: authorize</text>
  <text class="small" x="706" y="274">imports: wasi:clocks</text>
  <text class="mono" x="706" y="302">same binary on</text>
  <text class="mono" x="706" y="324">laptop and cloud</text>

  <rect class="box-cyan" x="990" y="170" width="130" height="180" rx="12"/>
  <text class="label" x="1010" y="202" fill="#89dceb">WIT</text>
  <text class="small" x="1010" y="230">typed</text>
  <text class="small" x="1010" y="252">interface</text>
  <text class="small" x="1010" y="274">contract</text>
  <text class="mono" x="1010" y="302">.wit</text>

  <!-- links -->
  <path class="line" d="M 348 260 L 382 260" marker-end="url(#arrow)"/>
  <path class="line" d="M 652 260 L 686 260" marker-end="url(#arrow)"/>
  <path class="line" d="M 956 260 L 990 260" marker-end="url(#arrow)"/>

  <!-- wasi -->
  <rect class="box-cyan" x="52" y="448" width="1096" height="130" rx="12"/>
  <text class="label" x="76" y="480" fill="#89dceb">WASI: THE PORTABLE SYSTEM INTERFACE</text>
  <text class="small" x="76" y="508">wasi:filesystem  |  wasi:sockets  |  wasi:clocks  |  wasi:random  |  wasi:cli  |  wasi:http</text>
  <text class="small" x="76" y="534">The component declares what it imports. The host grants only those capabilities. No ambient authority.</text>
  <text class="small" x="76" y="556">This is the security model: a sandbox is only useful if the interface is explicit and the host enforces it.</text>

  <text class="small" x="52" y="616">The promise is not "write once, run everywhere." It is "compose once, link anywhere, with capabilities you can audit."</text>
</svg>
