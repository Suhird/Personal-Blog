<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">eBPF hook points across the Linux kernel</title>
  <desc id="desc">eBPF programs attach to tracepoints, kprobes, uprobes, XDP, tc, and cgroup hooks. A verifier checks safety; maps share state with user space.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#89dceb"/>
    </marker>
    <style>
      .bg { fill:#1e1e2e; }
      .box { fill:#181825; stroke:#45475a; stroke-width:1.5; }
      .box-cyan { fill:#11242b; stroke:#89dceb; stroke-width:1.8; }
      .box-green { fill:#17251a; stroke:#a6e3a1; stroke-width:1.8; }
      .box-mauve { fill:#241b2f; stroke:#cba6f7; stroke-width:1.8; }
      .box-yellow { fill:#2a2618; stroke:#f9e2af; stroke-width:1.8; }
      .title { fill:#cdd6f4; font:700 22px "JetBrains Mono","Hack",monospace; }
      .sub { fill:#a6adc8; font:14px "JetBrains Mono","Hack",monospace; }
      .label { fill:#cdd6f4; font:700 14px "JetBrains Mono","Hack",monospace; }
      .small { fill:#a6adc8; font:12px "JetBrains Mono","Hack",monospace; }
      .mono { fill:#f9e2af; font:11px "JetBrains Mono","Hack",monospace; }
      .line { stroke:#89dceb; stroke-width:2; fill:none; }
      .dash { stroke:#6c7086; stroke-width:1.5; fill:none; stroke-dasharray:6 5; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="650" rx="18"/>
  <text class="title" x="48" y="50">eBPF: SAFE, DYNAMIC CODE INSIDE THE KERNEL</text>
  <text class="sub" x="48" y="76">Attach a verified program to a hook, share state through maps, and observe or steer traffic without a kernel module.</text>

  <!-- user space -->
  <rect x="52" y="108" width="1096" height="170" rx="14" fill="none" stroke="#a6e3a1" stroke-dasharray="8 6"/>
  <text class="small" x="76" y="136" fill="#a6e3a1">USER SPACE</text>
  <rect class="box-green" x="76" y="154" width="300" height="100" rx="10"/>
  <text class="label" x="96" y="184" fill="#a6e3a1">eBPF tool / agent</text>
  <text class="small" x="96" y="210">load program, read maps</text>
  <text class="small" x="96" y="232">export metrics, traces, events</text>

  <rect class="box-green" x="420" y="154" width="300" height="100" rx="10"/>
  <text class="label" x="440" y="184" fill="#a6e3a1">BPF maps</text>
  <text class="small" x="440" y="210">hash, array, ring buffer</text>
  <text class="small" x="440" y="232">shared state kernel &lt;-&gt; user</text>

  <rect class="box-green" x="764" y="154" width="360" height="100" rx="10"/>
  <text class="label" x="784" y="184" fill="#a6e3a1">Verifier</text>
  <text class="small" x="784" y="210">proves termination + memory safety</text>
  <text class="small" x="784" y="232">rejects unbounded loops and bad pointers</text>

  <!-- kernel -->
  <rect x="52" y="310" width="1096" height="230" rx="14" fill="none" stroke="#89dceb" stroke-dasharray="8 6"/>
  <text class="small" x="76" y="338" fill="#89dceb">KERNEL</text>

  <rect class="box-cyan" x="76" y="356" width="190" height="70" rx="8"/>
  <text class="label" x="96" y="384" fill="#89dceb">XDP</text>
  <text class="mono" x="96" y="406">driver, pre-stack</text>

  <rect class="box-cyan" x="286" y="356" width="190" height="70" rx="8"/>
  <text class="label" x="306" y="384" fill="#89dceb">tc / qdisc</text>
  <text class="mono" x="306" y="406">egress + ingress</text>

  <rect class="box-cyan" x="496" y="356" width="190" height="70" rx="8"/>
  <text class="label" x="516" y="384" fill="#89dceb">kprobe / uprobe</text>
  <text class="mono" x="516" y="406">function entry/return</text>

  <rect class="box-cyan" x="706" y="356" width="190" height="70" rx="8"/>
  <text class="label" x="726" y="384" fill="#89dceb">tracepoint</text>
  <text class="mono" x="726" y="406">stable kernel events</text>

  <rect class="box-cyan" x="916" y="356" width="208" height="70" rx="8"/>
  <text class="label" x="936" y="384" fill="#89dceb">cgroup / LSM</text>
  <text class="mono" x="936" y="406">policy + scheduler</text>

  <text class="small" x="76" y="468">Same program can count syscalls, drop packets, enforce seccomp-like policy, or trace latency across the stack.</text>
  <text class="small" x="76" y="492">No module reload. No reboot. The verifier is the safety contract; the hook is the extension point.</text>
  <text class="small" x="76" y="516" fill="#f9e2af">Production rule: keep programs small, bounded, and observable. A bad eBPF program can still hurt latency at 10M packets/s.</text>

  <text class="small" x="52" y="592">eBPF is not magic. It is a tiny virtual machine with a strict verifier, a narrow helper API, and a very good JIT.</text>
  <text class="small" x="52" y="614">That combination is why it replaced a generation of kernel modules and sidecar proxies for observability and networking.</text>
</svg>
