<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">BNB bridge IAVL proof exploit</title>
  <desc id="desc">A legitimate IAVL range proof is modified by appending a malicious leaf and setting an attacker-controlled right hash. The verifier ignores the right field when both left and right exist, so the forged proof validates against the real root.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f38ba8"/>
    </marker>
    <style>
      .bg { fill:#1e1e2e; }
      .box { fill:#181825; stroke:#45475a; stroke-width:1.5; }
      .box-red { fill:#2a151b; stroke:#f38ba8; stroke-width:1.8; }
      .box-green { fill:#17251a; stroke:#a6e3a1; stroke-width:1.8; }
      .box-cyan { fill:#11242b; stroke:#89dceb; stroke-width:1.8; }
      .box-yellow { fill:#2a2618; stroke:#f9e2af; stroke-width:1.8; }
      .title { fill:#cdd6f4; font:700 22px "JetBrains Mono","Hack",monospace; }
      .sub { fill:#a6adc8; font:14px "JetBrains Mono","Hack",monospace; }
      .label { fill:#cdd6f4; font:700 14px "JetBrains Mono","Hack",monospace; }
      .small { fill:#a6adc8; font:12px "JetBrains Mono","Hack",monospace; }
      .mono { fill:#f9e2af; font:11px "JetBrains Mono","Hack",monospace; }
      .line { stroke:#f38ba8; stroke-width:2; fill:none; }
      .dash { stroke:#6c7086; stroke-width:1.5; fill:none; stroke-dasharray:6 5; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="700" rx="18"/>
  <text class="title" x="48" y="50">THE BNB BRIDGE: A PROOF THAT PROVED THE WRONG THING</text>
  <text class="sub" x="48" y="76">The root hash matched. The payload did not. That gap was worth about $570 million.</text>

  <!-- legitimate tree -->
  <rect x="52" y="110" width="500" height="390" rx="14" fill="none" stroke="#a6e3a1" stroke-dasharray="8 6"/>
  <text class="small" x="76" y="138" fill="#a6e3a1">LEGITIMATE IAVL TREE</text>
  <rect class="box-green" x="200" y="160" width="190" height="54" rx="8"/>
  <text class="label" x="220" y="193" fill="#a6e3a1">root hash</text>
  <rect class="box" x="120" y="260" width="150" height="54" rx="8"/>
  <text class="small" x="140" y="292">inner node L</text>
  <rect class="box" x="330" y="260" width="150" height="54" rx="8"/>
  <text class="small" x="350" y="292">inner node R</text>
  <rect class="box" x="75" y="360" width="140" height="54" rx="8"/>
  <text class="small" x="95" y="392">leaf: package 1</text>
  <rect class="box" x="235" y="360" width="140" height="54" rx="8"/>
  <text class="small" x="255" y="392">leaf: package 2</text>
  <rect class="box" x="395" y="360" width="130" height="54" rx="8"/>
  <text class="small" x="415" y="392">leaf: other</text>
  <path class="line" d="M 245 360 L 195 314" marker-end="url(#arrow)"/>
  <path class="line" d="M 305 360 L 365 314" marker-end="url(#arrow)"/>
  <path class="line" d="M 195 260 L 260 214" marker-end="url(#arrow)"/>
  <path class="line" d="M 365 260 L 330 214" marker-end="url(#arrow)"/>

  <!-- forged proof -->
  <rect x="600" y="110" width="548" height="390" rx="14" fill="none" stroke="#f38ba8" stroke-dasharray="8 6"/>
  <text class="small" x="624" y="138" fill="#f38ba8">FORGED PROOF</text>
  <rect class="box-red" x="650" y="160" width="220" height="54" rx="8"/>
  <text class="label" x="670" y="193" fill="#f38ba8">same root hash</text>
  <rect class="box-red" x="650" y="260" width="220" height="54" rx="8"/>
  <text class="small" x="670" y="285">path node with both</text>
  <text class="small" x="670" y="304">left and right set</text>
  <rect class="box-red" x="650" y="360" width="220" height="54" rx="8"/>
  <text class="small" x="670" y="385">attacker leaf: mint</text>
  <text class="mono" x="670" y="404">2,000,000 BNB</text>
  <rect class="box-yellow" x="910" y="260" width="200" height="154" rx="10"/>
  <text class="label" x="930" y="292" fill="#f9e2af">The bug</text>
  <text class="small" x="930" y="318">when left and right</text>
  <text class="small" x="930" y="340">both exist, the right</text>
  <text class="small" x="930" y="362">value is ignored</text>
  <text class="small" x="930" y="386" fill="#f38ba8">attacker controls it</text>
  <text class="mono" x="930" y="408">root check still passes</text>
  <path class="line" d="M 760 360 L 760 314" marker-end="url(#arrow)"/>
  <path class="line" d="M 760 260 L 760 214" marker-end="url(#arrow)"/>
  <path class="dash" d="M 870 300 L 910 330" marker-end="url(#arrow)"/>

  <!-- steps -->
  <rect class="box" x="52" y="530" width="1096" height="130" rx="12"/>
  <text class="label" x="76" y="562" fill="#89dceb">THE EXPLOIT IN FIVE STEPS</text>
  <text class="small" x="76" y="590">1. Become a relayer (deposit 100 BNB) so you can call the bridge's package handler.</text>
  <text class="small" x="76" y="612">2. Take a real proof from the first cross-chain transaction. Decode it; keep the genuine root path.</text>
  <text class="small" x="76" y="634">3. Append a malicious leaf (package sequence + payload hash) and set the path node's right hash to it.</text>
  <text class="small" x="76" y="656">4. The verifier ignores the right hash when both children exist, so the forged proof matches the real root.</text>
</svg>
